<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Cream background matching your logo -->
  <rect width="1200" height="630" fill="#F5F2E8"/>
  
  <!-- Main title in dark green -->
  <text x="600" y="180" font-family="Georgia, serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#2F5233">
    🥒 The Social Pickle
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="32" text-anchor="middle" fill="#2F5233">
    Connect, Play &amp; Share Pickleball
  </text>
  
  <!-- Description -->
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#4A6741">
    Connect with local players • Join games • Post your own
  </text>
  
  <!-- Call to action -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#4A6741">
    Build your community and never play alone again!
  </text>
  
  <!-- Decorative elements -->
  <circle cx="200" cy="500" r="8" fill="#3E5D45" opacity="0.3"/>
  <circle cx="250" cy="480" r="6" fill="#3E5D45" opacity="0.4"/>
  <circle cx="300" cy="520" r="10" fill="#3E5D45" opacity="0.2"/>
  
  <circle cx="1000" cy="500" r="8" fill="#3E5D45" opacity="0.3"/>
  <circle cx="950" cy="480" r="6" fill="#3E5D45" opacity="0.4"/>
  <circle cx="900" cy="520" r="10" fill="#3E5D45" opacity="0.2"/>
</svg>